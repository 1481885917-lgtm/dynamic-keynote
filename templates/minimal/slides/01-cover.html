<div class="slide__inner grid-12" style="align-items:center">
  <div class="col-6 stack" style="gap:clamp(14px,1.8vw,32px)">
    <div class="kicker" data-anim="rise" data-dur="0.8">分类 · 副标题</div>
    <h1 class="display" data-anim="typing" data-dur="1.3" data-split-speed="0.055">主标题</h1>
    <p class="lead" data-anim="rise" data-delay="0.75" data-dur="1.05">一句话说清价值，<br>不超过两行。</p>
    <div class="cluster" data-anim-group data-stagger="0.13" data-delay="1.05">
      <span class="chip" data-anim="rise">标签一</span>
      <span class="chip" data-anim="rise">标签二</span>
    </div>
  </div>

  <div class="col-6" style="display:grid;place-items:center;position:relative;height:100%">
    <div class="halo pulse" style="width:76%;aspect-ratio:1;border-radius:50%"></div>
    <div class="ring spin-slow" style="width:54%;aspect-ratio:1"></div>
    <svg viewBox="0 0 200 200" data-anim="float" data-delay="0.35" style="width:min(240px,22vw)">
      <circle cx="100" cy="100" r="72" fill="none" style="stroke:var(--accent)" stroke-width="2" opacity=".7"/>
      <circle cx="100" cy="100" r="26" style="fill:var(--accent)" opacity=".85"/>
      <circle cx="100" cy="100" r="52" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
    </svg>
  </div>
</div>
