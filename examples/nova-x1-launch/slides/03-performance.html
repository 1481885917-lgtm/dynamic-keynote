<div class="slide__inner stack" style="gap:clamp(18px,2.2vw,40px)">
  <div class="stack" style="gap:clamp(8px,1vw,16px)">
    <div class="kicker" data-anim="rise">性能</div>
    <h2 class="h1" data-anim="rise" data-delay="0.14">快，且持久</h2>
  </div>

  <div class="grid-12">
    <div class="col-4 card card--glow" data-anim="rise" data-delay="0.28">
      <div class="stat">
        <div class="stat__num">
          <span data-anim="count" data-count="3.4" data-count-decimals="1" data-count-dur="1.7">0</span><span class="stat__unit">×</span>
        </div>
        <div class="stat__label">多核性能提升</div>
      </div>
    </div>
    <div class="col-4 card" data-anim="rise" data-delay="0.42">
      <div class="stat">
        <div class="stat__num">
          <span data-anim="count" data-count="120" data-count-dur="1.7">0</span><span class="stat__unit">Hz</span>
        </div>
        <div class="stat__label">自适应刷新率</div>
      </div>
    </div>
    <div class="col-4 card" data-anim="rise" data-delay="0.56">
      <div class="stat">
        <div class="stat__num">
          <span data-anim="count" data-count="18" data-count-dur="1.7">0</span><span class="stat__unit">小时</span>
        </div>
        <div class="stat__label">视频播放续航</div>
      </div>
    </div>
  </div>

  <div class="bars" data-anim-group data-stagger="0.12" data-delay="0.75" style="max-width:min(880px,72vw)">
    <div class="bar-row" data-anim="rise">
      <span class="label">CPU</span>
      <div class="bar-track"><div class="bar-fill" data-anim="bar" data-value="96" data-dur="1.3"></div></div>
      <span class="bar-val">96</span>
    </div>
    <div class="bar-row" data-anim="rise">
      <span class="label">GPU</span>
      <div class="bar-track"><div class="bar-fill" data-anim="bar" data-value="88" data-dur="1.3"></div></div>
      <span class="bar-val">88</span>
    </div>
    <div class="bar-row" data-anim="rise">
      <span class="label">能效</span>
      <div class="bar-track"><div class="bar-fill" data-anim="bar" data-value="72" data-dur="1.3"></div></div>
      <span class="bar-val">72</span>
    </div>
    <div class="bar-row" data-anim="rise">
      <span class="label">散热</span>
      <div class="bar-track"><div class="bar-fill" data-anim="bar" data-value="64" data-dur="1.3"></div></div>
      <span class="bar-val">64</span>
    </div>
  </div>

  <p class="body" data-anim="rise" data-delay="1.5">对比上一代 A18 Pro 实测基准</p>
</div>
