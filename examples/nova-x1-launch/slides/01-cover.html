<div class="slide__inner grid-12" style="align-items:center">
  <div class="col-6 stack" style="gap:clamp(14px,1.8vw,32px)">
    <div class="cluster" style="gap:14px;align-items:center">
      <div data-morph="logo" style="width:34px;height:34px;flex:0 0 auto">
        <svg viewBox="0 0 48 48" style="width:100%;height:100%" data-anim="fade" data-delay="0.2">
          <circle cx="24" cy="24" r="19" fill="none" style="stroke:var(--accent)" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="6" style="fill:var(--accent)"/>
        </svg>
      </div>
      <div class="kicker" data-anim="rise" data-dur="0.8">NOVA 2026 · 新品发布</div>
    </div>
    <h1 class="display" data-anim="typing" data-dur="1.3" data-split-speed="0.055">NOVA X1</h1>
    <p class="lead" data-anim="rise" data-delay="0.75" data-dur="1.05">把整台设备，拆开给你看。<br>然后，你会重新认识它。</p>
    <div class="cluster" data-anim-group data-stagger="0.13" data-delay="1.05">
      <span class="chip" data-anim="rise">A19 Pro</span>
      <span class="chip" data-anim="rise">钛金属一体机身</span>
      <span class="chip" data-anim="rise">18 小时续航</span>
    </div>
  </div>

  <div class="col-6" style="display:grid;place-items:center;position:relative;height:100%">
    <div class="halo pulse" style="width:76%;aspect-ratio:1;border-radius:50%"></div>
    <div class="ring spin-slow" style="width:54%;aspect-ratio:1"></div>
    <div class="ring" style="width:70%;aspect-ratio:1;border-style:dashed;opacity:.5"></div>

    <svg viewBox="0 0 320 640" data-anim="float" data-delay="0.35"
         style="width:min(272px,24vw);filter:drop-shadow(0 50px 110px rgba(0,0,0,.72))">
      <defs>
        <linearGradient id="nx1body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3c414d"/><stop offset=".48" stop-color="#191d25"/><stop offset="1" stop-color="#2c313d"/>
        </linearGradient>
        <linearGradient id="nx1screen" x1="0" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#0e1622"/><stop offset=".55" stop-color="#111b2c"/><stop offset="1" stop-color="#05080e"/>
        </linearGradient>
        <radialGradient id="nx1glow" cx=".5" cy=".3" r=".62">
          <stop offset="0" style="stop-color:var(--accent)" stop-opacity=".5"/>
          <stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="6" y="6" width="308" height="628" rx="56" fill="url(#nx1body)"/>
      <rect x="14" y="14" width="292" height="612" rx="48" fill="url(#nx1screen)"/>
      <rect x="14" y="14" width="292" height="612" rx="48" fill="url(#nx1glow)"/>
      <rect x="116" y="22" width="88" height="26" rx="13" fill="#04060a"/>
      <circle cx="196" cy="35" r="4.5" style="fill:var(--accent)" opacity=".9"/>
      <path d="M60 430 Q160 360 260 430" fill="none" style="stroke:var(--accent)" stroke-width="2.5" opacity=".85" stroke-linecap="round"/>
      <path d="M60 470 Q160 400 260 470" fill="none" style="stroke:var(--accent)" stroke-width="1.6" opacity=".45" stroke-linecap="round"/>
      <text x="160" y="560" text-anchor="middle" style="fill:var(--muted)" font-size="15" letter-spacing="6" font-family="inherit">NOVA</text>
    </svg>
  </div>
</div>
