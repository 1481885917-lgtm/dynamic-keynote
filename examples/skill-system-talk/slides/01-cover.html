<div class="slide__inner grid-12" style="align-items:center">

    <div class="cluster" style="gap:14px;align-items:center">
      <div data-morph="logo" style="width:34px;height:34px;flex:0 0 auto">
        <svg viewBox="0 0 48 48" style="width:100%;height:100%" data-anim="fade" data-delay="0.2">
          <rect x="7" y="13" width="34" height="24" rx="6" fill="none" style="stroke:var(--accent)" stroke-width="2.4"/>
          <path d="M17 25 L21 29 L31 19" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  </div>

  <div class="col-6" style="display:grid;place-items:center;position:relative;height:100%">

    <div class="ring" style="width:72%;aspect-ratio:1;border-style:dashed;opacity:.45"></div>

    <svg viewBox="0 0 440 320" data-anim="float" data-delay="0.35"
         style="width:min(400px,30vw);filter:drop-shadow(0 46px 100px rgba(0,0,0,.65))">

        <rect x="46" y="44" width="340" height="230" rx="16" fill="none" stroke="rgba(255,255,255,.2)"/>
      </g>
      <g transform="rotate(3 220 160)">
        <rect x="52" y="46" width="340" height="230" rx="16" fill="#090c12" stroke="rgba(255,255,255,.16)"/>
        <line x1="52" y1="82" x2="392" y2="82" stroke="rgba(255,255,255,.1)"/>
        <circle cx="74" cy="64" r="5" fill="rgba(255,255,255,.24)"/>
        <circle cx="92" cy="64" r="5" fill="rgba(255,255,255,.16)"/>
        <circle cx="110" cy="64" r="5" fill="rgba(255,255,255,.11)"/>
        <text x="74" y="126" style="fill:var(--accent)" font-size="19" font-family="monospace">$</text>
        <text x="96" y="126" style="fill:var(--text)" font-size="16" font-family="monospace">claude</text>
        <rect x="162" y="110" width="11" height="19" style="fill:var(--accent)" opacity=".9"/>
        <text x="74" y="170" style="fill:var(--muted)" font-size="13" font-family="monospace" data-anim="rise" data-delay="0.85">▸ SKILL.md</text>
        <text x="74" y="196" style="fill:var(--muted)" font-size="13" font-family="monospace" data-anim="rise" data-delay="0.95">▸ references/</text>
        <text x="74" y="222" style="fill:var(--muted)" font-size="13" font-family="monospace" data-anim="rise" data-delay="1.05">▸ scripts/</text>
        <text x="74" y="248" style="fill:var(--muted)" font-size="13" font-family="monospace" data-anim="rise" data-delay="1.15">▸ assets/</text>
      </g>
    </svg>
  </div>
</div>
