<div class="slide__inner stack" style="gap:clamp(18px,2.2vw,40px);max-width:min(1180px,100%)">
  <div class="stack" style="gap:clamp(6px,.9vw,14px)">
    <div class="kicker" data-anim="rise">工作流</div>
    <h2 class="h1" data-anim="rise" data-delay="0.14">从一句话，到可运行产物</h2>
  </div>

  <div data-anim-group data-stagger="0.09" data-delay="0.32" data-dur="0.85"
       style="display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;gap:clamp(8px,.8vw,16px);align-items:stretch">

    <div class="card" data-anim="rise" style="display:grid;align-content:center;gap:clamp(4px,.6vw,10px);padding:clamp(14px,1.4vw,26px)">
      <div class="label" style="color:var(--accent)">01</div>
      <div class="h3">说清目标</div>
      <div class="body" style="font-size:clamp(12px,.86vw,15px)">一句自然语言，说明要什么</div>
    </div>

    <div style="display:grid;place-items:center" data-anim="fade">
      <svg width="18" height="18" viewBox="0 0 20 20"><path d="M7 4 L13 10 L7 16" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card" data-anim="rise" style="display:grid;align-content:center;gap:clamp(4px,.6vw,10px);padding:clamp(14px,1.4vw,26px)">
      <div class="label" style="color:var(--accent)">02</div>
      <div class="h3">命中 Skill</div>
      <div class="body" style="font-size:clamp(12px,.86vw,15px)">读到索引，知道去哪儿找</div>
    </div>

    <div style="display:grid;place-items:center" data-anim="fade">
      <svg width="18" height="18" viewBox="0 0 20 20"><path d="M7 4 L13 10 L7 16" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card" data-anim="rise" style="display:grid;align-content:center;gap:clamp(4px,.6vw,10px);padding:clamp(14px,1.4vw,26px)">
      <div class="label" style="color:var(--accent)">03</div>
      <div class="h3">按需加载</div>
      <div class="body" style="font-size:clamp(12px,.86vw,15px)">只读这次用到的文档</div>
    </div>

    <div style="display:grid;place-items:center" data-anim="fade">
      <svg width="18" height="18" viewBox="0 0 20 20"><path d="M7 4 L13 10 L7 16" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card" data-anim="rise" style="display:grid;align-content:center;gap:clamp(4px,.6vw,10px);padding:clamp(14px,1.4vw,26px)">
      <div class="label" style="color:var(--accent)">04</div>
      <div class="h3">执行工具</div>
      <div class="body" style="font-size:clamp(12px,.86vw,15px)">脚本跑起来，顺带出日志</div>
    </div>

    <div style="display:grid;place-items:center" data-anim="fade">
      <svg width="18" height="18" viewBox="0 0 20 20"><path d="M7 4 L13 10 L7 16" fill="none" style="stroke:var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="card card--glow" data-anim="rise" style="display:grid;align-content:center;gap:clamp(4px,.6vw,10px);padding:clamp(14px,1.4vw,26px)">
      <div class="label" style="color:var(--accent)">05</div>
      <div class="h3">交付产物</div>
      <div class="body" style="font-size:clamp(12px,.86vw,15px)">单文件，双击就能跑</div>
    </div>
  </div>

  <p class="body" data-anim="rise" data-delay="1.15">第 2 步是关键：模型不需要知道全部细节，只需要知道<span class="hl">细节在哪儿</span>。</p>
</div>
