<div class="slide__inner stack" style="gap:clamp(16px,2vw,34px);max-width:min(1180px,100%)">
  <div class="stack" style="gap:clamp(6px,.9vw,14px)">
    <div class="kicker" data-anim="rise">取舍</div>
    <h2 class="h1" data-anim="rise" data-delay="0.14">提示词、脚本，还是 Skill</h2>
  </div>

  <div data-anim-group data-stagger="0.045" data-delay="0.3" data-dur="0.7"
       class="grid-12" style="row-gap:clamp(6px,.9vw,16px);align-items:center">

    <div class="col-3 label" data-anim="rise">能力维度</div>
    <div class="col-3 center" data-anim="rise" style="font-size:clamp(13px,1.05vw,18px)">一次性提示词</div>
    <div class="col-3 center" data-anim="rise" style="font-size:clamp(13px,1.05vw,18px)">脚本</div>
    <div class="col-3 center" data-anim="rise" style="font-size:clamp(13px,1.05vw,18px);color:var(--accent);font-weight:600">Skill</div>

    <div class="col-3 body" data-anim="rise">沉淀成可复用资产</div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.28">—</span></div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.55">○</span></div>
    <div class="col-3 center" data-anim="fade" style="background:var(--accent-soft);border-radius:10px;padding:4px 0"><span style="font-size:1.35em;color:var(--accent)">✓</span></div>

    <div class="col-3 body" data-anim="rise">AI 能按需调用</div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.55">○</span></div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.28">—</span></div>
    <div class="col-3 center" data-anim="fade" style="background:var(--accent-soft);border-radius:10px;padding:4px 0"><span style="font-size:1.35em;color:var(--accent)">✓</span></div>

    <div class="col-3 body" data-anim="rise">可版本化、可回滚</div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.28">—</span></div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;color:var(--accent);opacity:.8">✓</span></div>
    <div class="col-3 center" data-anim="fade" style="background:var(--accent-soft);border-radius:10px;padding:4px 0"><span style="font-size:1.35em;color:var(--accent)">✓</span></div>

    <div class="col-3 body" data-anim="rise">人能读懂并维护</div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.55">○</span></div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;color:var(--accent);opacity:.8">✓</span></div>
    <div class="col-3 center" data-anim="fade" style="background:var(--accent-soft);border-radius:10px;padding:4px 0"><span style="font-size:1.35em;color:var(--accent)">✓</span></div>

    <div class="col-3 body" data-anim="rise">可与其他 Skill 组合</div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.28">—</span></div>
    <div class="col-3 center" data-anim="fade"><span style="font-size:1.35em;opacity:.28">—</span></div>
    <div class="col-3 center" data-anim="fade" style="background:var(--accent-soft);border-radius:10px;padding:4px 0"><span style="font-size:1.35em;color:var(--accent)">✓</span></div>
  </div>

  <p class="body" data-anim="rise" data-delay="1.4">提示词是一次性的，脚本是确定性的，Skill 是<span class="hl">可被模型理解的资产</span>。</p>
</div>
